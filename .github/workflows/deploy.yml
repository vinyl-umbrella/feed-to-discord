name: Deploy

on:
  push:
    branches:
      - main

# デプロイの同時実行を防ぐ（CloudFormation のスタック更新は直列である必要がある）
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write # OIDC で AWS の IAM ロールを引き受けるために必要
  contents: read

env:
  AWS_REGION: ap-northeast-1

jobs:
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build
        run: sam build

      # NOTE: DiscordSecrets の SecretString はテンプレート側で組み立てているため、
      # 毎回 3 つのパラメータを渡さないと Secrets Manager の値が壊れる。
      - name: Deploy
        env:
          S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --s3-bucket "$S3_BUCKET" \
            --region "$AWS_REGION" \
            --parameter-overrides \
              "DiscordPublicKey=$DISCORD_PUBLIC_KEY" \
              "DiscordBotToken=$DISCORD_BOT_TOKEN" \
              "DiscordApplicationId=$DISCORD_APPLICATION_ID"
